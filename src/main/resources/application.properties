server.port=8088

# HTTPS 自签名证书（配置 server.ssl.host 即启用；首次启动自动生成 keystore.p12 / cert.pem / key.pem 到 server.ssl.cert.dir）
server.ssl.enabled=false
server.ssl.host=10.35.79.185
server.ssl.cert.dir=certs
server.ssl.keystore.password=plinth

token.expire=86400
mybatis.environment.id=development
JDBC.driver=org.h2.Driver
JDBC.url=jdbc:h2:file:./data/minio_shell;MODE=MySQL;DB_CLOSE_DELAY=-1
JDBC.username=sa
JDBC.password=

# MinIO 后端（管理员凭据，应用用它操作所有用户桶；/s3/* 重签名代理也用它转发到 MinIO）
minio.endpoint=http://127.0.0.1:9000
minio.accessKey=minioadmin
minio.secretKey=minioadmin
minio.region=
# 用户桶名前缀，最终桶名 = 前缀 + 用户 id，如 user-1
minio.bucketPrefix=user-
# 展示给用户的 S3 兼容端点（mc/aws-cli 配置用），形如 https://host/s3
s3.external.endpoint=http://localhost:443/s3

# Default admin (auto-created on startup if not exists)
# admin.default.username=admin
# admin.default.password=admin