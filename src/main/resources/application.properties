server.port=8080

# HTTP 连接空闲超时(毫秒)。大文件下载时客户端慢/写阻塞超过该时长无字节往来会被断开
# (Jetty 默认仅 30s，表现为下载中断后浏览器重新下载)，文件服务场景调大到 5 分钟
server.idleTimeout=300000

server.ssl.enabled=false
server.ssl.host=10.35.79.185
server.ssl.cert.dir=certs
server.ssl.keystore.password=plinth

